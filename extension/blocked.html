<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0E0F12; color: #F1EFEA; font: 16px/1.5 system-ui, sans-serif; }
    main { text-align: center; padding: 24px; max-width: 420px; }
    h1 { color: #E9C46A; font-size: 22px; margin: 0 0 24px; }
    p { color: #8B8F98; }
    #site { color: #F1EFEA; }
  </style>
</head>
<body>
  <main>
    <h1>Block</h1>
    <p><span id="site"></span> está bloqueada mientras estudias.</p>
    <p>Vuelve a lo tuyo. Se desbloquea sola al terminar la sesión.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
